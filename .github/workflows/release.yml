name: Release

on:
  push:
    tags:
      - "v*"

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  # Build and test with a read-only token. Dependency install scripts run here,
  # never in the job that can write releases.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag (vX.Y.Z) is the source of the release version: stamp it into
      # package.json so the build bakes it into dist/module.json, keeping the
      # published manifest, the zip, and the tag in lockstep.
      - name: Set version from tag
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - run: npm run lint
      - run: npm run test
      - run: npm run build

      # The zip must carry the licences of what it bundles.
      - name: Check licence files are packaged
        run: test -f dist/LICENSE && test -f dist/THIRD-PARTY-NOTICES.md

      # Package the drop-in module folder: built JS/CSS + manifest + i18n +
      # licences. Exclude sourcemaps so they don't ship to end users.
      - name: Assemble module.zip
        run: |
          cd dist
          zip -r ../module.zip . -x '*.map'
          cd ..

      # Use the curated changelog entry as the GitHub release body. Failing here
      # keeps a tag with missing release notes from producing a half-finished release.
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '^### ' release-notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            module.zip
            dist/module.json
            release-notes.md
          if-no-files-found: error

  # Publish what the build job produced. The only job with write access; it
  # runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      # A signed build-provenance attestation, so anyone can check that a
      # module.zip came from this workflow at this tag:
      #   gh attestation verify module.zip -R <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            module.zip
            dist/module.json

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Table Companion ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
          # Publish the built manifest (version stamped from the tag), not the
          # repo copy — they share everything but the version.
          files: |
            dist/module.json
            module.zip
